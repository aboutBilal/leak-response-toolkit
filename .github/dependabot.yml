# Keeps pinned dependencies current with weekly pull requests:
# GitHub Actions (pinned by commit SHA) and the container base image (pinned by digest).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
