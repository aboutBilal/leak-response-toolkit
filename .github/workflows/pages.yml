name: pages

# Builds and checks the documentation site on every pull request and push to main,
# and deploys it to GitHub Pages from main.
# One-time setup: Settings > Pages > Source: "GitHub Actions", then add the repository
# variable PAGES_ENABLED = true (Settings > Secrets and variables > Actions > Variables).
# Until then the site is built (to catch errors) but not deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to the same pull request cancels the older check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble site source
        run: ./tools/build-site.sh _site_src

      - name: Build with Jekyll (GitHub Pages)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./_site_src
          destination: ./_site

      - name: Check links, anchors, page metadata and the search index
        run: python3 tools/check-site.py _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'

  deploy:
    name: Deploy to GitHub Pages
    if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
