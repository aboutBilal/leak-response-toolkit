name: release

# On every version tag: publish a GitHub Release from CHANGELOG.md (and backfill
# any earlier tag that has none) with a source archive signed by Sigstore, then
# build, publish and sign the container image (amd64 + arm64, SBOM, provenance).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: GitHub release (notes + signed source archive)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create releases from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tag in $(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=version:refname); do
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then continue; fi
            version="${tag#v}"
            awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} /^## \[/ && found {exit} found' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$tag" --repo "$REPO" --title "$tag" --notes-file notes.md --verify-tag
            echo "released $tag"
          done

      - name: Move the major version tag to this release (for example v3 -> v3.2.0)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-list -n 1 "$TAG")"
          major="${TAG%%.*}"
          if gh api "repos/$REPO/git/refs/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha" >/dev/null
          fi
          echo "moved $major to $TAG ($sha)"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attach a signed source archive to this release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="leak-response-toolkit-${TAG}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "$TAG"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          cosign sign-blob --yes --bundle "${name}.tar.gz.sigstore.json" "${name}.tar.gz"
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "${name}.tar.gz" "${name}.tar.gz.sha256" "${name}.tar.gz.sigstore.json"

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Sigstore signing of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"
