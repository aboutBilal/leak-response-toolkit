name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every commit with gitleaks
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose

  shellcheck:
    name: shellcheck scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every script
        run: shellcheck -S warning scripts/*.sh leak prevention/hooks/pre-commit

  tests:
    name: script tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Run tests (offline; test secrets are generated at runtime)
        run: bats tests

  links:
    name: documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links between files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true

  action:
    name: action self-test (scan + SARIF, audit, audit-org)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF produced by scan mode
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan mode, with SARIF
        uses: ./
        with:
          mode: scan
          sarif-file: leak-scan.sarif

      - name: Upload SARIF to code scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: leak-scan.sarif
          category: leak-response-toolkit

      - name: Audit mode
        uses: ./
        with:
          mode: audit

      - name: Audit-org mode
        uses: ./
        with:
          mode: audit-org
          owner: aboutBilal
          fail-on-findings: "false"

  macos:
    name: macOS (Homebrew bash, BSD tools)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: brew install bash bats-core gitleaks jq

      - name: Tests (60 s limit per test; failures reported as annotations)
        env:
          BATS_TEST_TIMEOUT: "60"
        run: |
          set +e
          bats --tap --timing --print-output-on-failure tests | tee tap.txt
          rc=${PIPESTATUS[0]}
          awk '/^not ok/ {name=$0; body=""; n=0; next}
               name && /^#/ && n < 12 {body=body "%0A" $0; n++; next}
               name && !/^#/ {print "::error title=macOS test failed::" name body; name=""}
               END {if (name) print "::error title=macOS test failed::" name body}' tap.txt
          exit "$rc"

      - name: Smoke test
        run: |
          ./leak doctor --offline
          ./leak audit .
