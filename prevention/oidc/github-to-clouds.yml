# Keyless deployments: GitHub Actions signs in to the cloud with a short-lived
# OIDC token (about an hour) instead of a stored access key. Nothing to leak,
# nothing to rotate. Pick the job for your cloud; the IDs below are not secrets.
#
# One-time setup on the cloud side: trust GitHub's OIDC issuer and limit the
# trust to THIS repository and branch or environment (the token's `sub` claim,
# for example  repo:<org>/<repo>:ref:refs/heads/main  or  repo:<org>/<repo>:environment:production).
name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # lets the job request an OIDC token
  contents: read

jobs:
  aws:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::<account-id>:role/<deploy-role>
          aws-region: <region>
      - run: aws sts get-caller-identity

  azure:
    runs-on: ubuntu-latest
    steps:
      # Needs a federated credential on the app registration or managed identity.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az account show --output table

  gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/<project-number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
          service_account: <sa-name>@<project-id>.iam.gserviceaccount.com
      - run: gcloud auth list
