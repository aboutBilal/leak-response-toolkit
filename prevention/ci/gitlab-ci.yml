# Add this job to .gitlab-ci.yml. GitLab also offers built-in Secret Detection
# and secret push protection (availability depends on your plan); this job works on any plan.
secret-scan:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0" # full history
  script:
    - gitleaks git . --redact --no-banner --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
