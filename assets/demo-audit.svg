<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5">
<text class="ln" style="white-space:pre;animation-delay:0.00s" x="24" y="58" fill="#e6edf3" font-weight="700">$ leak audit legacy-api</text>
<text class="ln" style="white-space:pre;animation-delay:0.82s" x="24" y="80" fill="#e6edf3" font-weight="700">Secret hygiene audit: legacy-api</text>
<text class="ln" style="white-space:pre;animation-delay:1.04s" x="24" y="102" fill="#e6edf3" font-weight="700">1. Files that usually hold secrets</text>
<text class="ln" style="white-space:pre;animation-delay:1.26s" x="24" y="124" fill="#ff7b72" font-weight="700">  ✘ tracked by Git: .env</text>
<text class="ln" style="white-space:pre;animation-delay:1.48s" x="24" y="146" fill="#8b949e" font-weight="400">      → rotate anything inside them, then: git rm --cached &lt;file&gt; and add to .gitignore</text>
<text class="ln" style="white-space:pre;animation-delay:1.70s" x="24" y="168" fill="#e6edf3" font-weight="700">2. Ignore rules</text>
<text class="ln" style="white-space:pre;animation-delay:1.92s" x="24" y="190" fill="#f0b72f" font-weight="400">  ! not ignored: .env .env.local server.pem id_rsa terraform.tfstate</text>
<text class="ln" style="white-space:pre;animation-delay:2.14s" x="24" y="212" fill="#8b949e" font-weight="400">      → append prevention/gitignore-secrets to .gitignore</text>
<text class="ln" style="white-space:pre;animation-delay:2.36s" x="24" y="234" fill="#f0b72f" font-weight="400">  ! code reads environment variables but there is no .env.example</text>
<text class="ln" style="white-space:pre;animation-delay:2.58s" x="24" y="256" fill="#8b949e" font-weight="400">      → commit prevention/env/env.example, adapted</text>
<text class="ln" style="white-space:pre;animation-delay:2.80s" x="24" y="278" fill="#e6edf3" font-weight="700">3. Commit-time blocking</text>
<text class="ln" style="white-space:pre;animation-delay:3.02s" x="24" y="300" fill="#f0b72f" font-weight="400">  ! no pre-commit secret scanner configured</text>
<text class="ln" style="white-space:pre;animation-delay:3.24s" x="24" y="322" fill="#8b949e" font-weight="400">      → copy prevention/pre-commit-config.yaml to .pre-commit-config.yaml</text>
<text class="ln" style="white-space:pre;animation-delay:3.46s" x="24" y="344" fill="#f0b72f" font-weight="400">  ! no pre-commit hook installed in this clone</text>
<text class="ln" style="white-space:pre;animation-delay:3.68s" x="24" y="366" fill="#8b949e" font-weight="400">      → pre-commit install   (or copy prevention/hooks/pre-commit)</text>
<text class="ln" style="white-space:pre;animation-delay:3.90s" x="24" y="388" fill="#e6edf3" font-weight="700">4. CI secret scanning</text>
<text class="ln" style="white-space:pre;animation-delay:4.12s" x="24" y="410" fill="#f0b72f" font-weight="400">  ! CI exists but runs no secret scan</text>
<text class="ln" style="white-space:pre;animation-delay:4.34s" x="24" y="432" fill="#8b949e" font-weight="400">      → add a job from prevention/ci/</text>
<text class="ln" style="white-space:pre;animation-delay:4.56s" x="24" y="454" fill="#e6edf3" font-weight="700">5. Container hygiene</text>
<text class="ln" style="white-space:pre;animation-delay:4.78s" x="24" y="476" fill="#ff7b72" font-weight="700">  ✘ secret-looking value baked into an image: Dockerfile:3 (ENV API_TOKEN=&lt;redacted&gt;)</text>
<text class="ln" style="white-space:pre;animation-delay:5.00s" x="24" y="498" fill="#8b949e" font-weight="400">      → use BuildKit secret mounts: prevention/docker/Dockerfile.build-secrets.example</text>
<text class="ln" style="white-space:pre;animation-delay:5.22s" x="24" y="520" fill="#e6edf3" font-weight="700">6. Full history</text>
<text class="ln" style="white-space:pre;animation-delay:5.44s" x="24" y="542" fill="#ff7b72" font-weight="700">  ✘ 2 secret finding(s) in history (types: generic-api-key, stripe-access-token)</text>
<text class="ln" style="white-space:pre;animation-delay:5.66s" x="24" y="564" fill="#8b949e" font-weight="400">      → rotate them first, then see docs/06-scenarios.md (scenario A) to clean history</text>
<text class="ln" style="white-space:pre;animation-delay:5.88s" x="24" y="586" fill="#c9d1d9" font-weight="400"></text>
<text class="ln" style="white-space:pre;animation-delay:6.10s" x="24" y="608" fill="#ff7b72" font-weight="700">Score: 0/100 (0%) · Grade F  (critical findings cap the grade at F)</text>
<rect class="cur" x="24" y="616" width="9" height="3" fill="#56d364" style="animation:show 0s 6.32s forwards,blink 1s steps(1) 6.32s infinite"/>
