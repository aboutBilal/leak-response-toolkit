<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="432" viewBox="0 0 1280 432" role="img" aria-label="How it works, in four steps. 01 Prevent: leak audit. 02 Detect: leak scan. 03 Respond: leak hunt. 04 Report and learn: leak report.">
  <!-- Tokens: assets/DESIGN.md. Ember marks sequence only; cards are neutral. -->
  <rect width="1280" height="432" rx="12" fill="#0B0F1A"/>
  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="72" y="72" fill="#A3ADBF" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.6">HOW IT WORKS</text>
    <text x="72" y="112" fill="#E6EAF2" font-size="32" font-weight="700" letter-spacing="-0.3">Before, during and after a leak</text>

    <!-- Four cards: width 264, gutter 24, x = 72, 360, 648, 936 -->
    <g>
      <rect x="72" y="152" width="264" height="216" rx="12" fill="#111827" stroke="#2B3445"/>
      <text x="96" y="192" fill="#FF8A5C" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.6">01 · PREVENT</text>
      <text x="96" y="224" fill="#E6EAF2" font-size="20" font-weight="700">Design leaks out</text>
      <text x="96" y="256" fill="#A3ADBF" font-size="15">Hooks, push protection, CI</text>
      <text x="96" y="280" fill="#A3ADBF" font-size="15">scans and keyless deploys.</text>
      <rect x="96" y="312" width="120" height="32" rx="8" fill="#1C2433" stroke="#2B3445"/>
      <text x="156" y="333" fill="#E6EAF2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14.5" text-anchor="middle">leak audit</text>
    </g>
    <g>
      <rect x="360" y="152" width="264" height="216" rx="12" fill="#111827" stroke="#2B3445"/>
      <text x="384" y="192" fill="#FF8A5C" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.6">02 · DETECT</text>
      <text x="384" y="224" fill="#E6EAF2" font-size="20" font-weight="700">Find every secret</text>
      <text x="384" y="256" fill="#A3ADBF" font-size="15">Every commit and branch,</text>
      <text x="384" y="280" fill="#A3ADBF" font-size="15">values always redacted.</text>
      <rect x="384" y="312" width="112" height="32" rx="8" fill="#1C2433" stroke="#2B3445"/>
      <text x="440" y="333" fill="#E6EAF2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14.5" text-anchor="middle">leak scan</text>
    </g>
    <g>
      <rect x="648" y="152" width="264" height="216" rx="12" fill="#111827" stroke="#2B3445"/>
      <text x="672" y="192" fill="#FF8A5C" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.6">03 · RESPOND</text>
      <text x="672" y="224" fill="#E6EAF2" font-size="20" font-weight="700">Contain the spread</text>
      <text x="672" y="256" fill="#A3ADBF" font-size="15">Rotate, preserve evidence,</text>
      <text x="672" y="280" fill="#A3ADBF" font-size="15">hunt for surviving copies.</text>
      <rect x="672" y="312" width="112" height="32" rx="8" fill="#1C2433" stroke="#2B3445"/>
      <text x="728" y="333" fill="#E6EAF2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14.5" text-anchor="middle">leak hunt</text>
    </g>
    <g>
      <rect x="936" y="152" width="272" height="216" rx="12" fill="#111827" stroke="#2B3445"/>
      <text x="960" y="192" fill="#FF8A5C" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.6">04 · REPORT</text>
      <text x="960" y="224" fill="#E6EAF2" font-size="20" font-weight="700">Close the loop</text>
      <text x="960" y="256" fill="#A3ADBF" font-size="15">Leadership report, review</text>
      <text x="960" y="280" fill="#A3ADBF" font-size="15">template, team drill.</text>
      <rect x="960" y="312" width="128" height="32" rx="8" fill="#1C2433" stroke="#2B3445"/>
      <text x="1024" y="333" fill="#E6EAF2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14.5" text-anchor="middle">leak report</text>
    </g>
    <g stroke="#828D9F" stroke-width="1.5" fill="none">
      <path d="M340 260 H356"/><path d="M628 260 H644"/><path d="M916 260 H932"/>
    </g>
  </g>
</svg>
