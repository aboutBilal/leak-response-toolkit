<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Leak Response Toolkit: prevent secret leaks, respond in minutes. A terminal shows leak audit giving this repository grade A.">
  <defs>
    <radialGradient id="bg" cx="0.78" cy="0.15" r="1">
      <stop offset="0" stop-color="#28336a"/>
      <stop offset="0.45" stop-color="#141a35"/>
      <stop offset="1" stop-color="#0a0e1d"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.04"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a59" stop-opacity="0"/><stop offset="0.5" stop-color="#ff9a5a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="22" fill="url(#grid)"/>
  <rect x="0" y="438" width="1280" height="2" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(70,74) scale(0.62)">
    <path d="M64 8 L110 25 V62 C110 93 90 112 64 122 C38 112 18 93 18 62 V25 Z" fill="url(#acc)"/>
    <path d="M64 8 L110 25 V40 C88 32 40 32 18 40 V25 Z" fill="url(#shine)"/>
    <circle cx="64" cy="56" r="13" fill="#0b1020"/><path d="M57 64 H71 L75 92 H53 Z" fill="#0b1020"/>
  </g>
  <text x="160" y="118" fill="#ffb347" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2.5">OPEN SOURCE · MIT · SIGNED RELEASES</text>
  <text x="68" y="196" fill="#f4f6fb" font-family="Ubuntu,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700">Leak Response Toolkit</text>
  <text x="70" y="246" fill="#b3bcd8" font-family="Ubuntu,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25">Prevent secret leaks. Respond in minutes.</text>
  <text x="70" y="282" fill="#7d86a8" font-family="Ubuntu,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">Architecture · tested prevention kit · runbooks · CLI · Action · Docker</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700">
    <rect x="70" y="318" width="118" height="42" rx="21" fill="#56d364" fill-opacity="0.12" stroke="#56d364" stroke-opacity="0.8"/><text x="129" y="345" fill="#7ee08a" text-anchor="middle">audit</text>
    <rect x="200" y="318" width="106" height="42" rx="21" fill="#ff7a59" fill-opacity="0.14" stroke="#ff7a59" stroke-opacity="0.8"/><text x="253" y="345" fill="#ff9b80" text-anchor="middle">scan</text>
    <rect x="318" y="318" width="106" height="42" rx="21" fill="#79c0ff" fill-opacity="0.12" stroke="#79c0ff" stroke-opacity="0.8"/><text x="371" y="345" fill="#9ccfff" text-anchor="middle">hunt</text>
    <rect x="436" y="318" width="124" height="42" rx="21" fill="#d2a8ff" fill-opacity="0.12" stroke="#d2a8ff" stroke-opacity="0.8"/><text x="498" y="345" fill="#dcbcff" text-anchor="middle">report</text>
  </g>

  <!-- terminal card: real output of `leak audit .` on this repository -->
  <g filter="url(#shadow)">
    <rect x="730" y="62" width="490" height="318" rx="14" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M744 62 H1206 A14 14 0 0 1 1220 76 V98 H730 V76 A14 14 0 0 1 744 62 Z" fill="#161b22"/>
    <circle cx="754" cy="80" r="6" fill="#ff5f56"/><circle cx="774" cy="80" r="6" fill="#ffbd2e"/><circle cx="794" cy="80" r="6" fill="#27c93f"/>
    <text x="985" y="85" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">leak audit · this repository</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
       <text x="754" y="130" fill="#e6edf3" font-weight="700">$ leak audit .</text>
       <text x="754" y="160" fill="#56d364">✔ <tspan fill="#c9d1d9">none tracked by Git</tspan></text>
       <text x="754" y="185" fill="#56d364">✔ <tspan fill="#c9d1d9">.env, keys and state files are ignored</tspan></text>
       <text x="754" y="210" fill="#56d364">✔ <tspan fill="#c9d1d9">pre-commit config includes a secret scanner</tspan></text>
       <text x="754" y="235" fill="#56d364">✔ <tspan fill="#c9d1d9">CI runs a secret scan</tspan></text>
       <text x="754" y="260" fill="#56d364">✔ <tspan fill="#c9d1d9">no secret values in ARG/ENV</tspan></text>
       <text x="754" y="285" fill="#56d364">✔ <tspan fill="#c9d1d9">no secrets found in any commit</tspan></text>
       <text x="754" y="327" fill="#56d364" font-weight="700">Score: 100/100 (100%) · Grade A</text>
    </g>
    <rect x="1116" y="300" width="78" height="56" rx="12" fill="#56d364" fill-opacity="0.14" stroke="#56d364"/>
    <text x="1155" y="340" fill="#7ee08a" font-family="Ubuntu,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">A</text>
  </g>
</svg>
