<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Leak Response Toolkit: rotate first, hunt copies, prevent the next one">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1f3a"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
</defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<rect width="1200" height="300" rx="20" fill="url(#grid)"/>
<g transform="translate(92,78)">
  <rect x="0" y="40" width="112" height="92" rx="16" fill="url(#acc)"/>
  <path d="M22 40 V18 a34 34 0 0 1 68 0 V40" fill="none" stroke="url(#acc)" stroke-width="14" stroke-linecap="round"/>
  <path d="M90 40 V26" fill="none" stroke="#0b1020" stroke-width="16"/>
  <circle cx="56" cy="78" r="12" fill="#0b1020"/><rect x="51" y="82" width="10" height="26" rx="4" fill="#0b1020"/>
</g>
<text x="250" y="132" fill="#f4f6fb" font-family="Ubuntu,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700">Leak Response Toolkit</text>
<text x="252" y="178" fill="#aab3cf" font-family="Ubuntu,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24">Code or secrets went public? The first hour, step by step.</text>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" font-weight="700">
  <rect x="252" y="206" width="168" height="40" rx="20" fill="#ff7a59" fill-opacity="0.16" stroke="#ff7a59"/><text x="336" y="232" fill="#ff9b80" text-anchor="middle">1 · rotate</text>
  <rect x="436" y="206" width="196" height="40" rx="20" fill="#79c0ff" fill-opacity="0.12" stroke="#79c0ff"/><text x="534" y="232" fill="#9ccfff" text-anchor="middle">2 · hunt copies</text>
  <rect x="648" y="206" width="186" height="40" rx="20" fill="#56d364" fill-opacity="0.12" stroke="#56d364"/><text x="741" y="232" fill="#7ee08a" text-anchor="middle">3 · investigate</text>
  <rect x="850" y="206" width="160" height="40" rx="20" fill="#d2a8ff" fill-opacity="0.12" stroke="#d2a8ff"/><text x="930" y="232" fill="#dcbcff" text-anchor="middle">4 · prevent</text>
</g>
</svg>
