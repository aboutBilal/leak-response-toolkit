<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Spillkit: prevent secret leaks, respond in minutes">
<rect width="1280" height="640" fill="#0B0F1A"/>
<g transform="translate(0,72)">
  <!-- Tokens: assets/DESIGN.md. 8-pt grid, one accent (ember), status colour only for status. -->
  <defs>
    <filter id="elev" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/></filter>
  </defs>
  

  <!-- Copy column: x = 72 -->
  <g transform="translate(72,80) scale(0.5)">
    <path d="M44 40 V28 a10 10 0 0 1 10 -10 h20 a10 10 0 0 1 10 10 V40" fill="none" stroke="#B8301A" stroke-width="10" stroke-linecap="round"/>
    <rect x="10" y="38" width="108" height="78" rx="18" fill="#F04A2E"/>
    <path d="M28 38 h72 a18 18 0 0 1 18 18 v4 H10 v-4 a18 18 0 0 1 18 -18 Z" fill="#FF6A45"/>
    <rect x="10" y="58" width="108" height="5" fill="#B8301A"/>
    <circle cx="44" cy="88" r="12" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M56 88 H96 M84 88 V99 M95 88 V97" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="152" y="120" fill="#A3ADBF" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.6">OPEN SOURCE · MIT LICENSE</text>
  <text x="72" y="200" fill="#E6EAF2" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5">Spillkit</text>
  <text x="72" y="248" fill="#A3ADBF" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25">Prevent secret leaks. Respond in minutes.</text>

  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">
    <rect x="72" y="296" width="96" height="40" rx="8" fill="#1C2433" stroke="#2B3445"/><text x="120" y="321" fill="#E6EAF2" text-anchor="middle">audit</text>
    <rect x="184" y="296" width="88" height="40" rx="8" fill="#1C2433" stroke="#2B3445"/><text x="228" y="321" fill="#E6EAF2" text-anchor="middle">scan</text>
    <rect x="288" y="296" width="88" height="40" rx="8" fill="#1C2433" stroke="#2B3445"/><text x="332" y="321" fill="#E6EAF2" text-anchor="middle">hunt</text>
    <rect x="392" y="296" width="104" height="40" rx="8" fill="#1C2433" stroke="#2B3445"/><text x="444" y="321" fill="#E6EAF2" text-anchor="middle">report</text>
  </g>
  <text x="72" y="376" fill="#828D9F" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16">Architecture, tested prevention configs, runbooks, CLI, GitHub Action</text>

  <!-- Product window: real output of `leak audit .` on this repository -->
  <g filter="url(#elev)">
    <rect x="712" y="64" width="496" height="312" rx="12" fill="#111827" stroke="#2B3445"/>
    <path d="M724 64 H1196 A12 12 0 0 1 1208 76 V104 H712 V76 A12 12 0 0 1 724 64 Z" fill="#1C2433"/>
    <circle cx="736" cy="84" r="5" fill="#2B3445"/><circle cx="754" cy="84" r="5" fill="#2B3445"/><circle cx="772" cy="84" r="5" fill="#2B3445"/>
    <text x="960" y="89" fill="#828D9F" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">leak audit · this repository</text>
    <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5">
      <text x="736" y="128"><tspan fill="#FF8A5C">$</tspan><tspan fill="#E6EAF2"> leak audit .</tspan></text>
      <text x="736" y="160" fill="#3FB950">✔ <tspan fill="#A3ADBF">no secret files tracked by Git</tspan></text>
      <text x="736" y="184" fill="#3FB950">✔ <tspan fill="#A3ADBF">.env, keys and state files are ignored</tspan></text>
      <text x="736" y="208" fill="#3FB950">✔ <tspan fill="#A3ADBF">pre-commit secret scanner configured</tspan></text>
      <text x="736" y="232" fill="#3FB950">✔ <tspan fill="#A3ADBF">pre-commit hook installed in this clone</tspan></text>
      <text x="736" y="256" fill="#3FB950">✔ <tspan fill="#A3ADBF">CI runs a secret scan</tspan></text>
      <text x="736" y="280" fill="#3FB950">✔ <tspan fill="#A3ADBF">.env excluded from builds; no secrets in ARG/ENV</tspan></text>
      <text x="736" y="304" fill="#3FB950">✔ <tspan fill="#A3ADBF">no secrets found in any commit</tspan></text>
      <text x="736" y="344" fill="#E6EAF2" font-weight="700">Score 100/100 · Grade <tspan fill="#3FB950">A</tspan></text>
    </g>
  </g>
</g>
<line x1="72" y1="552" x2="1208" y2="552" stroke="#2B3445"/>
<text x="72" y="592" fill="#828D9F" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="16">github.com/aboutBilal/spillkit</text>
<text x="1208" y="592" fill="#828D9F" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">Signed releases · SBOM · OpenSSF Scorecard</text>
</svg>
