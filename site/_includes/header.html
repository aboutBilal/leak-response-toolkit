<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ site.baseurl }}/"><img src="{{ site.baseurl }}/assets/logo.svg" alt="" width="24" height="24"><span>Leak Response Toolkit</span></a>
    <nav class="main-nav" aria-label="Main">
      <a href="{{ site.baseurl }}/overview.html"{% if page.url == "/overview.html" %} aria-current="page"{% endif %}>Docs</a>
      <a href="{{ site.baseurl }}/docs/01-runbook.html"{% if page.url == "/docs/01-runbook.html" %} aria-current="page"{% endif %}>Runbook</a>
      <a href="{{ site.baseurl }}/docs/08-secrets-by-design.html"{% if page.url == "/docs/08-secrets-by-design.html" %} aria-current="page"{% endif %}>Prevention</a>
      <a href="{{ site.baseurl }}/CHANGELOG.html"{% if page.url == "/CHANGELOG.html" %} aria-current="page"{% endif %}>Changelog</a>
    </nav>
    <div class="header-actions">
      <button type="button" class="search-trigger" data-search-open aria-label="Search the documentation" aria-keyshortcuts="Control+K Meta+K">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-label">Search docs</span><kbd data-mod>Ctrl K</kbd>
      </button>
      {% unless include.home %}<button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>{% endunless %}
      <a class="icon-btn gh-link" href="https://github.com/{{ site.repository }}" aria-label="Source code on GitHub">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </a>
      <a class="incident-link" href="{{ site.baseurl }}/CHEATSHEET.html"><span class="alert-dot" aria-hidden="true"></span>Leaked a secret?</a>
      {% if include.docs %}<button type="button" class="icon-btn menu-btn" aria-expanded="false" aria-controls="sidebar" aria-label="Open navigation">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>{% endif %}
    </div>
  </div>
</header>
