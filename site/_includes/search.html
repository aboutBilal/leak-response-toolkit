<dialog class="search-dialog" id="search" aria-label="Search the documentation">
  <div class="search-box" role="search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search-input" type="search" placeholder="Search runbooks, guides and templates" autocomplete="off" spellcheck="false"
      role="combobox" aria-expanded="true" aria-controls="search-results" aria-autocomplete="list" aria-label="Search">
    <kbd>Esc</kbd>
  </div>
  <ul id="search-results" class="search-results" role="listbox" aria-label="Search results"></ul>
  <p class="search-empty" hidden></p>
  <div class="search-foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</dialog>
